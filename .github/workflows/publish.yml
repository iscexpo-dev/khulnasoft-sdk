name: Publish PyPI
on:
  push:
    branches:
      - main   # publish on push to main

permissions: {}

jobs:
  check-version:
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    outputs:
      should-publish: ${{ steps.version-check.outputs.should-publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check if version already published
        id: version-check
        run: |
          VERSION=$(python scripts/get-version.py)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/khulnasoft/$VERSION/json")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version $VERSION already exists on PyPI, skipping publish"
            echo "should-publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not found on PyPI, proceeding with publish"
            echo "should-publish=true" >> $GITHUB_OUTPUT
          fi

  publish:
    needs: check-version
    if: needs.check-version.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for creating tags
      id-token: write  # required for Trusted Publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/p/khulnasoft
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv venv --python 3.14
      - run: uv pip install build
      - name: Create tag from version
        run: |
          VERSION=$(python scripts/get-version.py)
          TAG="v$VERSION"
          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping tag creation"
          else
            echo "Creating tag $TAG"
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git tag "$TAG"
            git push origin "$TAG"
          fi
      - name: Verify tag matches version
        run: |
          VERSION=$(python scripts/get-version.py)
          TAG="v$VERSION"
          echo "Verifying tag $TAG matches version $VERSION"
      - name: Build
        run: uv run python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
